<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<title>移动端预览</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100dvh;
    background: linear-gradient(135deg, #e8e5df 0%, #d4cfc5 100%);
    font-family: Inter, system-ui, -apple-system, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px;
    gap: 12px;
  }
  .device-label {
    font-size: 13px;
    color: #6b5d4d;
    font-weight: 500;
  }
  .device-frame {
    width: 390px;
    height: 844px;
    background: #1a1a1a;
    border-radius: 44px;
    padding: 12px;
    box-shadow:
      0 0 0 2px #333,
      0 24px 48px rgba(0,0,0,0.25),
      0 4px 12px rgba(0,0,0,0.15);
    position: relative;
  }
  .device-notch {
    position: absolute;
    top: 12px; left: 50%;
    transform: translateX(-50%);
    width: 120px; height: 28px;
    background: #1a1a1a;
    border-radius: 0 0 18px 18px;
    z-index: 10;
  }
  .device-screen {
    width: 100%; height: 100%;
    border-radius: 32px;
    overflow: hidden;
    background: #fff;
  }
  .device-screen iframe {
    width: 100%; height: 100%;
    border: 0;
  }
  .open-direct {
    font-size: 12px;
    color: #6b5d4d;
  }
  .open-direct a { color: #2E3A5A; text-decoration: none; font-weight: 500; }
  .open-direct a:hover { text-decoration: underline; }
</style>
</head>
<body>
  <div class="device-label">iPhone 15 · 390 × 844</div>
  <div class="device-frame">
    <div class="device-notch"></div>
    <div class="device-screen">
      <iframe src="index.html" allow="pointer-lock"></iframe>
    </div>
  </div>
  <div class="open-direct">直接访问：<a href="index.html" target="_blank">/mobile/index.html</a></div>
</body>
</html>
